<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    .h { font-size: 15px; font-weight: 600; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #57606a; }
    .m { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .ln { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .top { fill: #fff4e0; stroke: #d4a14a; stroke-width: 1.5; }
    .mid { fill: #fde8ef; stroke: #c9668a; stroke-width: 1.5; }
    .base { fill: #efe9fb; stroke: #8064c4; stroke-width: 1.5; }
  </style>

  <rect width="1200" height="540" rx="12" fill="#ffffff"/>
  <text x="30" y="42" font-size="20" font-weight="700">SBERT Perfume Recommender: model architecture</text>

  <!-- 1. Input notes -->
  <text x="30" y="90" class="h">1. Input notes</text>
  <rect x="30" y="110" width="170" height="70" rx="8" class="top"/>
  <text x="44" y="138" class="t">Top</text>
  <text x="44" y="160" class="s">bergamot, lemon, orange</text>
  <rect x="30" y="195" width="170" height="70" rx="8" class="mid"/>
  <text x="44" y="223" class="t">Middle</text>
  <text x="44" y="245" class="s">rose, jasmine, …</text>
  <rect x="30" y="280" width="170" height="70" rx="8" class="base"/>
  <text x="44" y="308" class="t">Base</text>
  <text x="44" y="330" class="s">musk, amber, vanilla</text>
  <text x="30" y="375" class="s">comma-separated, split per note</text>

  <!-- 2. SBERT encoding -->
  <path d="M200,145 H246" class="ln"/>
  <path d="M200,230 H246" class="ln"/>
  <path d="M200,315 H246" class="ln"/>
  <text x="250" y="90" class="h">2. Note encoding</text>
  <rect x="250" y="110" width="190" height="240" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="345" y="200" class="t" text-anchor="middle" font-size="18">SBERT</text>
  <text x="345" y="222" class="m" text-anchor="middle">all-MiniLM-L6-v2</text>
  <text x="345" y="258" class="s" text-anchor="middle">each note → 384-d vector</text>
  <text x="345" y="278" class="s" text-anchor="middle">(cached per note)</text>

  <!-- 3. IDF-weighted mean -->
  <path d="M440,145 H486" class="ln"/>
  <path d="M440,230 H486" class="ln"/>
  <path d="M440,315 H486" class="ln"/>
  <text x="490" y="90" class="h">3. IDF-weighted mean</text>
  <rect x="490" y="110" width="200" height="70" rx="8" class="top"/>
  <text x="504" y="138" class="m">e_top</text>
  <text x="504" y="160" class="s">Σ ŵ(n) · emb(n), 384-d</text>
  <rect x="490" y="195" width="200" height="70" rx="8" class="mid"/>
  <text x="504" y="223" class="m">e_middle</text>
  <text x="504" y="245" class="s">Σ ŵ(n) · emb(n), 384-d</text>
  <rect x="490" y="280" width="200" height="70" rx="8" class="base"/>
  <text x="504" y="308" class="m">e_base</text>
  <text x="504" y="330" class="s">Σ ŵ(n) · emb(n), 384-d</text>
  <rect x="490" y="400" width="200" height="80" rx="8" class="box"/>
  <text x="504" y="428" class="m">w(n) = log(N/df(n)) + 1</text>
  <text x="504" y="450" class="s">rare notes weigh more;</text>
  <text x="504" y="468" class="s">ŵ = w normalized per layer</text>
  <path d="M590,400 V354" class="ln" stroke-dasharray="4 3"/>

  <!-- 4. Layer-wise cosine similarity -->
  <path d="M690,145 H736" class="ln"/>
  <path d="M690,230 H736" class="ln"/>
  <path d="M690,315 H736" class="ln"/>
  <text x="740" y="90" class="h">4. Layer-wise cosine</text>
  <rect x="740" y="110" width="200" height="240" rx="8" class="box"/>
  <text x="840" y="132" class="s" text-anchor="middle">DB perfume layer j</text>
  <text x="808" y="154" class="s" text-anchor="middle">T</text>
  <text x="852" y="154" class="s" text-anchor="middle">M</text>
  <text x="896" y="154" class="s" text-anchor="middle">B</text>
  <text x="770" y="190" class="s" text-anchor="middle">T</text>
  <text x="770" y="234" class="s" text-anchor="middle">M</text>
  <text x="770" y="278" class="s" text-anchor="middle">B</text>
  <g fill="#f6f8fa" stroke="#d0d7de">
    <rect x="786" y="164" width="44" height="44"/><rect x="830" y="164" width="44" height="44"/><rect x="874" y="164" width="44" height="44"/>
    <rect x="786" y="208" width="44" height="44"/><rect x="830" y="208" width="44" height="44"/><rect x="874" y="208" width="44" height="44"/>
    <rect x="786" y="252" width="44" height="44"/><rect x="830" y="252" width="44" height="44"/><rect x="874" y="252" width="44" height="44"/>
  </g>
  <text x="840" y="318" class="m" text-anchor="middle">cos(q_i, d_j)</text>
  <text x="840" y="336" class="s" text-anchor="middle">3×3 map per DB perfume</text>
  <text x="758" y="234" class="s" text-anchor="middle" transform="rotate(-90 758 234)">query i</text>

  <rect x="740" y="400" width="200" height="80" rx="8" class="box"/>
  <text x="754" y="428" class="t">Perfume DB</text>
  <text x="754" y="450" class="s">24,063 perfumes, steps 2–3</text>
  <text x="754" y="468" class="m">precomputed N × 3 × 384</text>
  <path d="M840,400 V354" class="ln"/>

  <!-- 5. Weighted score & ranking -->
  <path d="M940,230 H986" class="ln"/>
  <text x="990" y="90" class="h">5. Score &amp; rank</text>
  <rect x="990" y="110" width="180" height="240" rx="8" class="box"/>
  <text x="1080" y="132" class="s" text-anchor="middle">layer weights W</text>
  <g stroke="#d0d7de">
    <rect x="1014" y="146" width="44" height="44" fill="#9ec5f0"/><rect x="1058" y="146" width="44" height="44" fill="#e3eefb"/><rect x="1102" y="146" width="44" height="44" fill="#f6f8fa"/>
    <rect x="1014" y="190" width="44" height="44" fill="#e3eefb"/><rect x="1058" y="190" width="44" height="44" fill="#7fb3ec"/><rect x="1102" y="190" width="44" height="44" fill="#d5e5f8"/>
    <rect x="1014" y="234" width="44" height="44" fill="#f6f8fa"/><rect x="1058" y="234" width="44" height="44" fill="#d5e5f8"/><rect x="1102" y="234" width="44" height="44" fill="#5f9fe6"/>
  </g>
  <g class="m" text-anchor="middle">
    <text x="1036" y="172">0.8</text><text x="1080" y="172">0.25</text><text x="1124" y="172">0.1</text>
    <text x="1036" y="216">0.25</text><text x="1080" y="216">1.0</text><text x="1124" y="216">0.35</text>
    <text x="1036" y="260">0.1</text><text x="1080" y="260">0.35</text><text x="1124" y="260">1.2</text>
  </g>
  <text x="1080" y="306" class="m" text-anchor="middle">score = Σ cos ⊙ W</text>
  <text x="1080" y="326" class="s" text-anchor="middle">(W normalized to sum 1)</text>

  <rect x="990" y="400" width="180" height="80" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1080" y="434" class="t" text-anchor="middle">Top-k perfumes</text>
  <text x="1080" y="456" class="m" text-anchor="middle">torch.topk(score)</text>
  <path d="M1080,350 V396" class="ln"/>

  <text x="30" y="515" class="s">Diagonal of W compares same layers (Top↔Top, …); Base is weighted highest. Off-diagonal terms allow partial cross-layer matches.</text>
</svg>
